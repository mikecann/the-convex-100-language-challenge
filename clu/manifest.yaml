limitations:
  - >-
    `http` and `live` are both earned: `./run verify-all clu` passed
    31/31 shared conformance checks on both the local and hosted
    profiles from a clean, exact-head commit, alongside the two
    final-image policy checks against the compiled runtime and
    example-runtime images (uid 65532:65532, read-only filesystem, all
    capabilities dropped). `./run test clu` builds pclu from source at
    the pinned commit, applies client/wordvec-64bit-word-size.patch,
    adds the _tls builtin cluster, boots a hello-world smoke test,
    checks source style, and compiles and runs the full language-local
    unit suite -- the JSON codec (client/tests/json_test.clu, including
    json$array_items and the AGENTS.md-required integral-decimal
    regression), the arithmetic bitwise helpers
    (client/tests/bitops_test.clu, since CLU's own int cluster has no
    bitwise operators at all), SHA-1 (client/tests/sha1_test.clu,
    against FIPS 180-4 vectors and RFC 6455's own worked handshake
    example), base64 (client/tests/base64_test.clu, against RFC 4648
    vectors), this client's own DNS resolver
    (client/tests/dns_test.clu, against hand-assembled DNS packets),
    and real loopback-TCP/WebSocket/sync coverage against genuine peer
    processes, not mocks (client/tests/transport_test.clu, http_test.clu,
    websocket_test.clu, sync_test.clu) -- then compiles and links the
    canonical example and the conformance adapter and proves the
    adapter's own hello/close NDJSON lifecycle.
  - >-
    client/convex-websocket.clu's delivery model is one buffered event
    per subscription in client/convex-sync.clu, not a queue: a fresh
    QueryUpdated/QueryFailed overwrites whatever that subscription's own
    previous undelivered value was, matching the pinned Go pilot's own
    "reactive queries represent current state" rationale. The
    conformance adapter never batches an event either -- it writes each
    one to stdout the moment it is produced -- so a stopped reader
    applies ordinary pipe backpressure to the adapter's single poll loop
    rather than either layer ever accumulating an unbounded backlog of
    its own. See convex-sync.clu's and the adapter's own header comments
    for the full reasoning.
  - >-
    Backoff-reset-after-a-valid-Transition is implemented
    (client/convex-sync.clu's handle_transition sets next_backoff_ms
    back to its initial value on every successful Transition) but is not
    independently proven by a dedicated timing unit test in
    client/tests/sync_test.clu, which instead proves five real
    debugDisconnect reconnects end to end, each with unchanged
    rehydration suppressed and the next real change still delivered.
    The shared conformance harness's own timing-based proof is the
    authoritative evidence for this behaviour, consistent with
    AGENTS.md's layered test model (language-local tests prove
    mechanics; shared conformance is the capability's real evidence).
  - >-
    Two real pclu compiler/toolchain quirks were found and worked around
    while building this: (1) a return statement's expression list is
    positional and one-value-per-slot -- a single nested call that
    itself yields several values can never fill several of those slots
    at once, unlike a plain multi-value assignment (`a, b := f()`), so
    every multi-value-returning exit spreads a record's fields out by
    hand rather than forwarding a helper call's result directly; (2) an
    `except` clause binds only to the single statement immediately
    before it, not to a run of statements, so a fallible call followed
    by an unguarded second statement before the `except` silently leaves
    that second statement's own signals uncaught -- multiple statements
    that need one shared handler have to be wrapped in an explicit
    `begin ... end` first. Both are documented at their call sites
    throughout this client (first found in client/convex-http.clu).
  - >-
    client/convex-json.clu is a minimal codec, not a general JSON-to-CLU
    value decoder: json$field walks a JSON document just far enough to
    find one top-level object field and return that field's own JSON
    text unparsed (correctly skipping strings with escapes, numbers,
    true/false/null, and arbitrarily nested objects or arrays along the
    way, so a same-named field nested inside an unrelated value is never
    mistaken for the field being searched for); a caller that wants the
    value interprets it with json$uint32, json$field again if it is
    itself an object, and so on. json$array_items applies the same
    approach to walking a Transition's own modifications array one
    element at a time.
  - >-
    A genuine, previously unreported latent bug was found and fixed in
    pclu's own _wordvec.c on 64-bit builds: CLUREF's size is 8 bytes here
    (sizeof of a tagged union whose largest member is a long/pointer),
    but _wordvec's byte- and half-word-addressed operations (bfetch,
    bstore, wfetch, wstore, lfetch, lstore, get_byte, set_byte) were
    written for 4-byte words and, unpatched, can only ever address the
    first four bytes of every eight-byte storage slot -- discovered
    because building a raw sockaddr_in by hand for a plain TCP connect
    always produced a null address. See
    client/wordvec-64bit-word-size.patch for the full writeup and fix.
  - >-
    A second genuine bug was found in pclu's own bundled DNS client,
    lib/clu/_resolve.clu: its resolv.conf reader only recognises ';' as
    a comment character (an Ultrix/BSD convention from its 1985/1989 MIT
    copyright header), not the '#' every modern Linux resolv.conf
    (including Docker's own generated one) uses, so it silently ends up
    querying the untouched default of 127.0.0.1 and every real hostname
    lookup times out. client/convex-dns.clu is this client's own small,
    from-scratch A-record resolver, used in place of _resolve for
    exactly this reason -- see that file's own header comment for the
    full writeup.
capabilities:
  - http
  - live
