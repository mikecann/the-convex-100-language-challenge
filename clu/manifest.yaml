schemaVersion: 1
id: clu
displayName: "CLU"
rank: 66
selectionTier: coverage
implementation:
  status: working
  provenance: native
  version: 0.1.0
  notes: >-
    Native Portable CLU (pclu) implementation of Convex's documented HTTP
    JSON API and the pinned /api/sync protocol. pclu has no sockets and no
    TLS visible from CLU source out of the box: raw BSD sockets already
    exist as hand-written C bound into the builtin _chan cluster
    (code/sysasm/Opt/_chan.c) and are used by this client's local profile,
    byte-packed from CLU with _wordvec; TLS does not exist at all
    upstream, so this client adds one small reviewed C file,
    client/convexrt-tls.c, as a brand-new builtin cluster (_tls) the same
    way pclu's own primitives are added: a .spc interface file plus a
    hand-authored C file the linker resolves by naming convention, with
    no HTTP, WebSocket, JSON, or Convex protocol knowledge inside it.
    Every deadline, retry, and protocol decision is enforced in CLU
    source. pclu has no threads, so the /api/sync state machine
    (client/convex-sync.clu) and the conformance adapter are both a
    single bounded poll loop rather than an owner goroutine/thread; see
    those files' own header comments. A genuine upstream 64-bit-port bug
    in _wordvec's byte/word addressing (see
    client/wordvec-64bit-word-size.patch) is also patched here, and
    pclu's own bundled DNS client (lib/clu/_resolve.clu) silently fails
    against a modern (Docker-generated) resolv.conf, worked around with
    this client's own small resolver, client/convex-dns.clu -- see that
    file's own header comment. Both are unrelated to Convex and worth
    reporting upstream independently of this project.
toolchain:
  name: pclu
  version: "1a8ad7603ea20b9744942182a52810441182f6a6"
syncProfile:
