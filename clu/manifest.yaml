schemaVersion: 1
id: clu
displayName: "CLU"
rank: 66
selectionTier: coverage
implementation:
  status: attempting
  provenance: native
  version: 0.1.0
  notes: >-
    Native Portable CLU (pclu) implementation of Convex's documented HTTP
    JSON API and the pinned /api/sync protocol, in progress. pclu has no
    sockets and no TLS visible from CLU source out of the box: raw BSD
    sockets already exist as hand-written C bound into the builtin _chan
    cluster (code/sysasm/Opt/_chan.c) and are used by this client's local
    profile, byte-packed from CLU with _wordvec; TLS does not exist at
    all upstream, so this client adds one small reviewed C file,
    client/convexrt-tls.c, as a brand-new builtin cluster (_tls) the same
    way pclu's own primitives are added: a .spc interface file plus a
    hand-authored C file the linker resolves by naming convention, with
    no HTTP, WebSocket, JSON, or Convex protocol knowledge inside it.
    Every deadline, retry, and protocol decision is enforced in CLU
    source. A genuine upstream 64-bit-port bug in _wordvec's byte/word
    addressing (see client/wordvec-64bit-word-size.patch) is also
    patched here; it is unrelated to Convex and worth reporting upstream.
toolchain:
  name: pclu
  version: "1a8ad7603ea20b9744942182a52810441182f6a6"
syncProfile:
  id: convex-rs-0.10.4-unversioned-sync
  sourceCommit: 6f1df8a8ba1665084ec001e307ca841ca17074d7
  endpoint: /api/sync
intendedCapabilities:
  - http
  - live
platforms:
  - linux/amd64
adapter:
  protocolVersion: 1
  entrypoint: /usr/local/bin/convex-adapter
  adapterOnlyCommands:
    - debugDisconnect
limitations:
  - >-
    This is an early, honest checkpoint, not a working client. `./run
    test clu` passes: it builds pclu from source at the pinned commit,
    applies client/wordvec-64bit-word-size.patch, adds the _tls builtin
    cluster, boots a hello-world smoke test, and compiles and runs four
    language-local unit suites -- client/tests/json_test.clu (the JSON
    codec, including the AGENTS.md-required integral-decimal
    regression), client/tests/bitops_test.clu (the arithmetic bitwise
    helpers WebSocket masking and its handshake SHA-1 will need, since
    CLU's own int cluster has no bitwise operators at all),
    client/tests/transport_test.clu, and client/tests/http_test.clu. The
    latter two are real loopback TCP coverage against
    client/tests/fixtures/{echo,http}_fixture.clu -- genuine peer
    processes, not mocks -- proving client/convex-transport.clu's conn
    type (dial/send/recv/close, unifying the plain _chan profile and the
    new _tls builtin behind one oneof, with poll-gated bounded reads on
    both so an idle peer is told apart from a closed one) and
    client/convex-http.clu's full HTTP/1.1 request/response framing
    against Convex's documented "format":"json" envelope
    (Content-Length, chunked transfer-encoding, and structured
    FunctionError/TransportError/ProtocolError classification) all the
    way through to a decoded field. Nothing further has been built: no
    RFC 6455 WebSocket framing, no /api/sync state machine, no
    conformance adapter, no canonical example, and no runtime images.
    `intendedCapabilities` above states the goal, not anything earned;
    `capabilities` below is empty and stays empty until root-owned local
    and hosted conformance both pass.
  - >-
    client/convex-transport.clu's plain-profile dial() only resolves a
    host as a literal dotted-quad address (inet_address, no network
    access) or via DNS (pclu's own _resolve library) -- this is
    sufficient for this client's actual traffic (the local profile's
    CONVEX_URL always names the compose service "backend", which
    resolves through Docker's own embedded DNS) but is not a general
    getaddrinfo-equivalent; there is no /etc/hosts consultation, since
    pclu's _resolve speaks raw DNS UDP only.
  - >-
    Two real pclu compiler/toolchain quirks were found and worked around
    while building this: (1) a return statement's expression list is
    positional and one-value-per-slot -- a single nested call that
    itself yields several values can never fill several of those slots
    at once, unlike a plain multi-value assignment (`a, b := f()`), so
    every multi-value-returning exit spreads a record's fields out by
    hand rather than forwarding a helper call's result directly; (2) an
    `except` clause binds only to the single statement immediately
    before it, not to a run of statements, so a fallible call followed
    by an unguarded second statement before the `except` silently leaves
    that second statement's own signals uncaught -- multiple statements
    that need one shared handler have to be wrapped in an explicit
    `begin ... end` first. Both are documented at their call sites in
    client/convex-http.clu.
  - >-
    client/convex-json.clu is a minimal codec, not a general JSON-to-CLU
    value decoder: json$field walks a JSON document just far enough to
    find one top-level object field and return that field's own JSON
    text unparsed (correctly skipping strings with escapes, numbers,
    true/false/null, and arbitrarily nested objects or arrays along the
    way, so a same-named field nested inside an unrelated value is never
    mistaken for the field being searched for); a caller that wants the
    value interprets it with json$uint32, json$field again if it is
    itself an object, and so on. This keeps the codec small while still
    being a real scanner rather than a toy; it has not yet been exercised
    against real Convex response shapes beyond the unit fixtures in
    client/tests/json_test.clu.
  - >-
    A genuine, previously unreported latent bug was found and fixed in
    pclu's own _wordvec.c on 64-bit builds: CLUREF's size is 8 bytes here
    (sizeof of a tagged union whose largest member is a long/pointer),
    but _wordvec's byte- and half-word-addressed operations (bfetch,
    bstore, wfetch, wstore, lfetch, lstore, get_byte, set_byte) were
    written for 4-byte words and, unpatched, can only ever address the
    first four bytes of every eight-byte storage slot -- discovered
    because building a raw sockaddr_in by hand for a plain TCP connect
    always produced a null address. pclu's own standard library
    (lib/clu/_resolve.clu, its DNS client) uses the exact same
    byte-packing pattern this client's local-profile transport does, so
    it likely also silently miscompiles on 64-bit builds; that was not
    chased down further since it is out of this client's scope. See
    client/wordvec-64bit-word-size.patch for the full writeup and fix.
  - >-
    Capability badges remain empty until the root-owned local and hosted
    conformance gates pass.
capabilities: []
