    - debugDisconnect
limitations:
  - Live authentication, optimistic updates, WebSocket mutations, and WebSocket actions are deferred.
  - The undocumented pinned sync profile can drift independently of the documented HTTP API.
  - Delivery holds at most the newest 16 updates and rejects a single encoded Live message above 2 MiB.
