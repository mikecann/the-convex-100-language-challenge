[package]
name = "convex-rust-demo"
version = "0.1.0"
edition = "2024"
publish = false
# `tests/conformance/main.rs` is an executable source, not an integration test.
# Explicit [[test]] targets below keep Cargo from compiling it twice.
autotests = false

[lib]
name = "convex_rust_demo"
path = "lib.rs"

[[bin]]
name = "convex-adapter"
path = "tests/conformance/main.rs"

[[bin]]
name = "convex-example"
path = "../examples/basics/main.rs"

[[test]]
name = "adapter_process"
path = "tests/adapter_process.rs"

[dependencies]
reqwest = { version = "0.12.23", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
url = "2.5.7"
uuid = { version = "1.18.0", features = ["v4"] }
crossbeam-channel = "0.5.15"
http = "1.3.1"
tungstenite = { version = "0.27.0", features = ["rustls-tls-native-roots"] }
