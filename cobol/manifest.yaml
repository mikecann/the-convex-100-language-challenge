limitations:
  - Never compiled or run. Every capability is unearned until the
    Docker test, example, and conformance gates pass.
  - COBOL has no threads, so the client is a cooperative single owner
    rather than a worker plus mutexes. The caller drives the transport
    by calling cvx-live-pump; nothing else touches the socket.
  - Each subscription retains the newest 16 updates across the client
    and drops the oldest when a consumer is slow.
  - Live authentication, WebSocket mutations and actions, optimistic
    updates, and mutation replay are deferred.
  - TransitionChunk assembly is deferred and treated as profile drift
    that retires the connection.
  - Live values cover the JSON-safe subset; tagged Convex value types
    are deferred.
  - JSON numbers in exponent form round-trip verbatim but are not
    reduced to integers.
  - A stopped controller stalls the adapter. Events are written
    synchronously with no output queue, so backpressure lands in the
    kernel pipe; this is deliberate, and the accounting test asserts
    it rather than working around it.
capabilities: []
