implementation:
  status: attempting
  provenance: native
  version: 0.1.0
  notes: >-
    Native GnuCOBOL client. JSON, HTTP/1.1 framing, the RFC 6455
    WebSocket layer, and all Convex protocol behaviour are implemented
    in COBOL. A reviewed native extension (client/convex-native.c)
    supplies only what the COBOL runtime cannot: a monotonic clock, a
    CSPRNG, a SHA-1 digest, and deadline-aware TCP and TLS stream I/O.
    Source is complete but has never been compiled or executed; no
    Docker evidence exists yet.
