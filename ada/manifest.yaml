limitations:
  - Live authentication, optimistic updates, WebSocket mutations, WebSocket actions, and TransitionChunk assembly are deferred.
  - The educational client supports Convex's JSON-safe value subset; tagged Convex value conversions are deferred.
  - Active Live subscriptions are bounded to 64 and 8 MiB of conservatively charged paths and arguments. The manager queue and the adapter's single output-owner queue each retain at most 16 events within separate conservative 20 MiB encoded and runtime-overhead budgets, including each in-flight event. Adapter writes have one absolute three-second deadline and subscription retirement barriers are bounded.
  - HTTP responses are capped at 2 MiB and WebSocket messages at 4 MiB. Parsed response trees are capped at depth 128 and 65,536 structural nodes; adapter commands use depth 128, 8,192 structural nodes, a 2 MiB line cap, and an eight-command input queue.
  - Adapter output lines are bounded by the 20 MiB output budget rather than by the command cap, so a Live delivery at the 4 MiB message ceiling is emitted normally. An event that still exceeds that ceiling is reported as a structured ProtocolError for its subscription or command, and the subscription continues.
  - HTTP responses with ambiguous framing are refused rather than interpreted. Repeated or list-valued Content-Length, repeated Transfer-Encoding, Content-Length combined with Transfer-Encoding, non-chunked transfer codings, malformed or folded header lines, and bodies declared above the 2 MiB cap are all rejected before allocation.
  - An intact HTTP response that is not a Convex envelope is a ProtocolError at every status, including 2xx. TransportError is reserved for connection failures, timeouts, and size-cap violations.
  - TLS handshake reset, plaintext-response, and stall failures are covered as bounded transport errors with recovery, and hostname verification is covered with an ephemeral CA and two leaves generated inside the Docker test stage. No key material is committed and the trust store is restored after the test.
  - Shared local and hosted conformance passed 31/31 from clean exact-head builds; the capability list records the evaluator award.
capabilities:
  - http
  - live
