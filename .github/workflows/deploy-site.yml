name: Deploy challenge site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-challenge-site
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to Cloudflare Workers
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Docker
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0
        with:
          version: v29.6.2

      - name: Build the static site from the publishing snapshot
        env:
          EVIDENCE_CHANNEL: local-preview
        run: ./run site-preview

      - name: Deploy the static assets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          mkdir -p _shared/site/.wrangler
          docker build \
            --file _shared/site/Dockerfile.deploy \
            --tag 100-convex-clients-site-deployer \
            _shared/site
          docker run --rm \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --env CLOUDFLARE_ACCOUNT_ID \
            --env CLOUDFLARE_API_TOKEN \
            --tmpfs /tmp \
            --tmpfs /root \
            --tmpfs /site/.wrangler \
            --volume "$PWD/_shared/site:/site:ro" \
            100-convex-clients-site-deployer \
            deploy --config wrangler.jsonc

      - name: Verify the custom domain
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors https://the-convex-100-language-challenge.mikecann.app/data.json >/dev/null
