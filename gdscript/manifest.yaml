implementation:
  status: attempting
  provenance: native
  version: 0.1.0
  notes: >-
    Native GDScript client for Godot 4. HTTPClient provides ordinary HTTP and
    TLS, WebSocketPeer provides RFC 6455 framing, and the Convex request and
    response envelopes, the strict Live query set, transitions, reconnects, and
    every deadline are implemented in GDScript. Capability badges stay empty
    until the coordinator runs shared local and hosted conformance.
