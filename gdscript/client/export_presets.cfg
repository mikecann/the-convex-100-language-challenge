; Export presets for the two runtime images.
;
; Each preset produces a .pck only. The runtime images pair that pack with
; Godot's Linux release export template, which is an engine runtime with no
; editor, no exporter, and no script tooling in it.
;
; The adapter pack excludes the canonical example, and the example pack
; excludes the conformance tests, so neither minimal image carries the other
; image's entry point.

[preset.0]

name="convex-adapter"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="examples/*,client/tests/fixtures/*,client/tests/harness.gd,client/tests/*_test.gd,client/tests/conformance/*_test.gd"
export_path=""
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false

[preset.1]

name="convex-example"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="client/tests/*,client/tests/fixtures/*,client/tests/conformance/*"
export_path=""
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false
