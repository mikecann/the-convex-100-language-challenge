implementation:
  status: attempting
  provenance: native
  version: 0.1.0
  notes: Native OCaml implementation of Convex JSON HTTP functions and the pinned sync WebSocket profile. Unix sockets and ocaml-ssl provide transport; Yojson provides JSON only.
