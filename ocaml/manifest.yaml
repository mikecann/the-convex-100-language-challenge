  name: OCaml
  version: 5.2.1
syncProfile:
  id: convex-rs-0.10.4-unversioned-sync
  sourceCommit: 6f1df8a8ba1665084ec001e307ca841ca17074d7
  endpoint: /api/sync
intendedCapabilities:
  - http
  - live
platforms:
  - linux/amd64
adapter:
  protocolVersion: 1
  entrypoint: /usr/local/bin/convex-adapter
  adapterOnlyCommands:
    - debugDisconnect
limitations:
  - Live authentication is deferred. The socket handshake carries whatever bearer token setAuth last stored, but token refresh, the sync-protocol Authenticate message, and AuthError recovery are unimplemented and unverified.
  - Optimistic updates, WebSocket mutations, and WebSocket actions are deferred.
  - Live values cover the JSON-safe subset; tagged Convex value types and TransitionChunk assembly are deferred as explicit protocol errors.
  - Each subscription retains at most 16 updates and 4 MiB of encoded values, dropping the oldest state when a consumer is slow.
capabilities: []
