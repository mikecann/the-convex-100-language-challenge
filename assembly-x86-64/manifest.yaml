id: assembly-x86-64
displayName: "Assembly (x86-64 NASM)"
rank: 24
selectionTier: ranked
implementation:
  status: working
  provenance: native
  version: 0.1.0
  notes: >-
    Hand-written x86-64 assembly (NASM, System V AMD64 calling convention)
    implementing the Convex HTTP API and the WebSocket-based Live sync
    protocol: request/response JSON envelope, query/mutation/action
    routing, structured error decoding, RFC 6455 WebSocket framing (the
    Upgrade handshake, client-side masking, fragmented-message reassembly
    with interleaved control frames, and single-pass UTF-8 validation over
    the reassembled message), and the Convex sync state machine (Connect,
    ModifyQuerySet Add/Remove, Transition, reconnect with exponential
    backoff and full Add resend, and rehydration suppression) are all
    written in assembly. TLS is provided by calling libssl/libcrypto
    directly through their C ABI (TLS_client_method, SSL_CTX_new,
    SSL_connect, SSL_read/SSL_write, with full peer verification via
    SSL_CTX_set_default_verify_paths and SSL_set1_host, plus SHA-1 for the
    WebSocket handshake's Sec-WebSocket-Accept check) -- the one delegation
    AGENTS.md explicitly calls legitimate. Sockets, DNS resolution
    (getaddrinfo), poll() and memory allocation (malloc/realloc/free) are
    the same OS/runtime primitives a C client would use. HTTP/1.1 request
    framing, response parsing (status line, headers, Content-Length and
    chunked-transfer body framing), the full JSON parser and serializer
    (including exact 64-bit integer precision for Convex's nanosecond sync
    timestamps, IEEE-754 double parsing, and string escape/unescape with
    surrogate-pair UTF-8 encoding), base64 encoding, and the NDJSON adapter
    protocol (a single poll()-driven event loop that owns the WebSocket
    exclusively) are all hand-written assembly with no delegated client
    runtime.
toolchain:
  name: NASM
  version: 2.16.01
