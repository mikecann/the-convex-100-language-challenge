implementation:
  status: attempting
  provenance: native
  version: 0.1.0
  notes: >-
    Hand-written x86-64 assembly (NASM, System V AMD64 calling convention)
    implementing the Convex HTTP API: request/response JSON envelope,
    query/mutation/action routing, and structured error decoding are all
    written in assembly. TLS is provided by calling libssl/libcrypto
    directly through their C ABI (TLS_client_method, SSL_CTX_new,
    SSL_connect, SSL_read/SSL_write, with full peer verification via
    SSL_CTX_set_default_verify_paths and SSL_set1_host) -- the one
    delegation AGENTS.md explicitly calls legitimate. Sockets, DNS
    resolution (getaddrinfo) and memory allocation (malloc/realloc/free)
    are the same OS/runtime primitives a C client would use. HTTP/1.1
    request framing, response parsing (status line, headers,
    Content-Length and chunked-transfer body framing), the full JSON
    parser and serializer (including exact 64-bit integer precision for
    Convex's nanosecond sync timestamps, IEEE-754 double parsing, and
    string escape/unescape with surrogate-pair UTF-8 encoding), and the
    NDJSON adapter protocol are all hand-written assembly with no
    delegated client runtime.
