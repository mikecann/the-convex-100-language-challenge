limitations:
  - Live authentication (sending the bearer token over the WebSocket) and
    sending mutations or actions over the WebSocket are both deferred;
    only query subscriptions use Live, matching this project's other
    hand-rolled clients. `Ping`, `MutationResponse` and `ActionResponse`
    server messages are still tolerated as no-ops.
  - Each subscription's delivery queue is bounded to 8 entries and drops
    the oldest queued update (freeing it) when a slow consumer falls more
    than 8 updates behind, rather than growing without limit or blocking
    the WebSocket reader.
  - A reconnect always resends every active query's Add and always
    receives a fresh QueryUpdated establishing its current value; an
    unchanged rehydration (the new value serializes identically to the
    last one actually delivered) is suppressed so a healthy reconnect
    never looks like a spurious update to the caller.
  - Live values cover the JSON-safe subset the rest of this client's JSON
    layer already handles; Convex's richer tagged value types are not
    specially decoded, matching the HTTP path.
  - Reconnect backoff starts at 200ms and doubles up to a 10s cap; a
    deliberate debugDisconnect resets it to the base delay so five rapid
    test-driven reconnects do not inherit an old maximum delay.
  - Double serialization uses a bounded fixed-point formatter (6
    fractional digits, trailing zeros trimmed, with a rounded-integer
    fallback above 1e12 magnitude) rather than a general shortest-round-trip
    dtoa. Convex's own JSON encoding of whole numbers as e.g. "0.0" is
    handled exactly; arbitrary irrational-looking doubles are not
    guaranteed to round-trip to the same text.
  - JSON parsing bounds nesting to 128 levels and total allocated nodes to
    200000 as a safety valve against pathological input; it does not
    otherwise limit input size.
  - HTTP response header parsing accumulates up to 64 KiB looking for the
    header terminator before giving up on a peer that never sends one.
  - A lone UTF-16 high surrogate immediately followed by another \u escape
    that is not its matching low surrogate consumes that escape as part of
    resolving the surrogate rather than re-parsing it as a separate
    character -- a documented simplification, not a crash or silent
    truncation.
  - IPv6 literal deployment URLs ("https://[::1]") are refused rather than
    partially supported.
  - Each HTTP call opens a fresh TCP/TLS connection (no keep-alive/pooling),
    matching the reference C client's own per-call curl_easy_init/cleanup
    behavior.
capabilities:
  - http
  - live
