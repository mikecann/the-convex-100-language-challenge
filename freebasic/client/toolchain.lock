# FreeBASIC toolchain pin for the Docker build.
#
# Debian does not package FreeBASIC, so the compiler is built from the official
# bootstrap source release inside the build stage. The bootstrap archive ships
# pre-generated C sources, so gcc alone can produce the first fbc.
#
# The official SourceForge release archive was downloaded directly and hashed
# during the source audit. The compiler build itself remains unexecuted.

