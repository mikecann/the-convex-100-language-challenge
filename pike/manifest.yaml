schemaVersion: 1
id: pike
displayName: "Pike"
rank: 96
selectionTier: curated_backfill
implementation:
  status: attempting
  provenance: native
  version: 0.1.0
  notes: >
    Native Pike client. Pike's Standards.JSON, Stdio, SSL, Crypto, and MIME
    modules supply ordinary JSON, sockets, TLS, SHA-1, and base64 only; Pike's
    TLS stack is itself written in Pike over Nettle, so no OpenSSL
    configuration, engine, or provider module is involved. The HTTP/1.1
    exchange, the Convex request and response envelopes, the RFC 6455 client,
    the pinned Live sync state machine, and the conformance adapter are all
    implemented in Pike in this directory.
toolchain:
  name: Pike
  version: "8.0 (Debian bookworm pike8.0-core)"
