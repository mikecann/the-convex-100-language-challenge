selectionTier: coverage
implementation:
  status: attempting
  provenance: native
  version: 0.1.0
  notes: >-
    Native GNU Awk implementation of the documented JSON HTTP functions and the
    pinned Live sync profile. A compiled in-process gawk extension built from
    client/convexext.c supplies bounded TLS sockets, a monotonic clock,
    SHA-1/base64/randomness, unsigned 64-bit timestamp comparison, and RFC6455
    frame encode/decode. The Convex HTTP envelope, JSON reader and writer, Live
    owner and state machine, replay after reconnect, NDJSON adapter, example,
    and tests are Awk. No curl, websocat, Node, Python, or other delegated
    client runtime is used.
toolchain:
  name: GNU Awk
  version: 5.3.2
