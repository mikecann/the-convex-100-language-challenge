schemaVersion: 1
id: apl
displayName: "APL"
rank: 69
selectionTier: coverage
implementation:
  status: attempting
  provenance: native
  version: 0.1.0
  notes: >-
    Native GNU APL implementation of both the Convex HTTP API and Live
    (the WebSocket /api/sync subscription protocol). JSON encoding and
    decoding, HTTP/1.1 request/response framing (status line, headers,
    Content-Length and chunked bodies), the "format":"json" envelope
    classification (client/convex.apl), RFC 6455 WebSocket framing
    (handshake, masking, fragmentation reassembly, interleaved control
    frames), and the sync-protocol state machine (Connect,
    ModifyQuerySet, Transition, reconnect with backoff, the
    subscription table -- client/convexlive.apl) are all written in
    APL, loaded by the conformance adapter and the canonical example
    the same way GNU APL's own shipped wslib5 libraries are loaded,
    with dyadic )COPY. GNU APL's built-in ⎕FIO (Quad-FIO[32..42])
    supplies raw sockets natively for the plain (ws://, http://)
    transport -- no shim needed. TLS (wss://, https://) uses a small
    native function, client/shim.cc, compiled against GNU APL's own
    internal headers and loaded at runtime with dyadic ⎕FX, the
    documented mechanism GNU APL's own lib_file_io.so uses. The same
    native function also supplies SHA-1 and CSPRNG bytes (both needed
    only for the RFC 6455 handshake and frame masking) and DNS
    resolution (⎕FIO's own connect() takes an already-resolved
    address; GNU APL has no getaddrinfo of its own). GNU APL has no
    threads, so Live's WebSocket reader is not a background worker:
    the whole adapter process is the one worker, polling the socket
    non-blockingly once per command-loop pass and interleaving that
    with reading the next NDJSON command. Toolchain built from source
    (the official GNU APL 2.0 release tarball, pinned by URL and
    sha256) rather than installed from Debian's own .deb: Debian
    packages GNU APL only in sid (not yet in trixie/bookworm) and only
    with --with-gtk3 enabled, which pulls in the full GTK/cairo/pango
    stack for a headless network client that never touches
    ⎕GTK/⎕PLOT/⎕PNG; the plain upstream tarball's default build
    (--with-gtk3 is off by default) gets the same GPL, Debian-adjacent
    GNU APL 2.0 with a runtime closure of just
    libstdc++/libm/libc/libgcc_s.
toolchain:
  name: GNU APL
  version: "2.0"
syncProfile:
  id: convex-rs-0.10.4-unversioned-sync
  sourceCommit: 6f1df8a8ba1665084ec001e307ca841ca17074d7
  endpoint: /api/sync
intendedCapabilities:
  - http
  - live
platforms:
  - linux/amd64
adapter:
  protocolVersion: 1
  entrypoint: /usr/local/bin/convex-adapter
  adapterOnlyCommands:
    - debugDisconnect
limitations:
  - >-
    client/tests/selftest.apl (the Docker `test` stage's offline
    language-local suite) covers HTTP-side behaviour only: JSON
    round-trip and escaping, object field lookup, whole-number
    acceptance, URL parsing, HTTP status-line/header helpers, chunked
    hex sizes, EnvGet, and HttpClassify's four envelope shapes. It does
    not include a local mock WebSocket fixture server exercising Live's
    edge cases deterministically and offline (fragmentation/control-
    frame interleaving, five reconnects with backoff-reset assertions,
    a stopped-reader queue bound, etc.) the way some other languages in
    this project do for their own `test` target. Every one of those
    scenarios this client actually implements is instead exercised
    against a real backend by the shared conformance pilot's
    `client/live/*` cases (reconnect-five-times genuinely reconnects
    five times over real TLS; query-error-recovery genuinely recovers
    from a real FunctionError) and, for the two bugs a real run alone
    could catch, by hand -- but that is real-backend evidence, not the
    fully offline, adversarial local coverage AGENTS.md's Live
    acceptance section asks for.
  - >-
    `./run test apl`, `./run verify-example apl`, and
    `./run verify-all apl` (both the local self-hosted and the
    dedicated hosted deployment profiles) all pass from a clean,
    exact-HEAD commit: the shared black-box conformance pilot
    (client/adapter/hello, client/http/*, client/live/*,
    client/adapter/clean-close -- 31 cases) reports "Earned
    capabilities: http, live" for both the reference oracle and this
    client, on both profiles.
  - >-
    The native function (client/shim.cc) is deliberately narrow: TCP
    connect/send/recv/close for TLS, SHA-1, CSPRNG bytes, and DNS
    resolution only. No HTTP, JSON, WebSocket framing, or Convex sync
    protocol behaviour lives in C++.
  - >-
    GNU APL's Quad-FIO[40] (select) reliably raised DOMAIN ERROR in
    this build even when its argument's shape and nesting exactly
    matched Quad_FIO.cc's own documented expectations (checked with
    rho/depth/pick before it ever reached select()). Both the HTTP
    transport and the Live WebSocket reader work around this with a
    non-blocking fcntl + Quad-FIO[37]/[41] recv()/read() poll loop
    instead, which does not have the same problem; the conformance
    adapter's own command loop uses the identical pattern to interleave
    reading the next NDJSON command with servicing the Live connection,
    since GNU APL has no threads to run them concurrently.
  - >-
    Three further landmines found only once Live was driven against a
    real backend end to end, beyond the ones already listed in
    README.md: a GNU APL function header cannot destructure a
    parenthesized left-argument strand like `(A B) Fn C` into two
    formal names -- it silently produces a DEFN ERROR and the whole
    body falls through to top-level immediate execution instead of
    ever running as a function, with no compile-time warning; the sync
    protocol's very first Transition on a fresh connection must be
    matched against startVersion.ts "AAAAAAAAAAA=" (timestamp zero,
    confirmed against a real backend), not an empty string; and
    client/shim.cc's TLS handle parameter, once round-tripped through
    convex.apl's `⍎` into a genuine APL numeric scalar, arrives at the
    native function as that number's raw codepoint (e.g. handle 1 as
    the SOH control character), not as ASCII decimal text -- the
    previous atoi()-based handle_of() silently misread every non-zero
    handle as 0, invisible with only one TLS connection ever open at a
    time (Live and HTTP never ran concurrently until this work) and
    surfaced only once Live's own persistent connection (slot 0) and a
    concurrent HTTP call's connection (slot 1) were open at once against
    the dedicated hosted target: the HTTP call's bytes were silently
    misrouted onto Live's socket instead. Fixed by reading the cell's
    numeric value directly.
  - >-
    The adapter's own command loop had an unthrottled busy-spin bug:
    once any Live command made LIVEACTIVE true, the tick branch called
    LiveServiceTick and looped straight back to the top without ever
    reaching the idle branch's sleep, previously reserved for when Live
    was not yet active. Confirmed with a cgroup memory trace against a
    real backend: flat around 22 MiB through every HTTP test and the
    first Live test, then climbing continuously (not one spike) past a
    128 MiB limit within about two seconds of Live going active,
    OOM-killing the adapter mid-conformance-run. Fixed by falling
    through to the same one-tick-per-pass sleep regardless of
    LIVEACTIVE.
  - >-
    GNU APL's own script-exit path (")OFF", required to leave the
    interpreter cleanly) appends one unsuppressible bare blank line to
    stdout after a script's last real line of output, independent of
    anything this client prints -- on top of the already-documented
    per-)COPY "DUMPED <mtime>" banner. Both example/entrypoint.sh and
    client/tests/conformance/entrypoint.sh filter it at the shell
    boundary (holding the most recently read line back by one step so
    a genuine trailing empty line can be dropped instead of printed),
    since neither is suppressible from inside the language.
capabilities: []
