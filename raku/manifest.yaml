implementation:
  status: attempting
  provenance: native
  version: 0.1.0
  notes: >
    Native Raku client. Raku libraries are used only for ordinary TLS, HTTP,
    JSON, and WebSocket transport: Cro::HTTP for the documented Functions HTTP
    API and Cro::WebSocket for RFC 6455 framing. The Convex request envelope,
    the response taxonomy, the pinned Live state machine, query set
    versioning, reconnect and rehydration behaviour, delivery buffering, and
    the adapter protocol are all implemented in Raku. The language-local test
    gate passes in Docker; shared conformance has not run yet, so no
    capability is claimed.
