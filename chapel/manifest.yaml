limitations:
  - Live authentication, optimistic updates, WebSocket mutations, and WebSocket actions are deferred.
  - Live values expose the JSON-safe subset as raw JSON; tagged Convex value types are deferred.
  - TransitionChunk assembly is deferred and treated as protocol drift that reconnects.
  - Each Live subscription retains at most the newest 16 updates within a 4 MiB byte budget.
  - At most 64 Live subscriptions are active at once, with one 32 MiB conservative aggregate budget for paths, arguments, last values, queued values, logs, errors, and runtime overhead.
