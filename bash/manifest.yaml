adapter:
  protocolVersion: 1
  entrypoint: /usr/local/bin/convex-adapter
  adapterOnlyCommands: [debugDisconnect]
limitations:
  - Live uses a direct Bash RFC6455 implementation. It supports the pinned sync profile only, with an intentionally bounded newest-16 delivery policy in the adapter.
  - WebSocket mutations, actions, Live authentication, optimistic updates, and TransitionChunk assembly are deferred.
  - The runtime deliberately includes jq, BusyBox wget, OpenSSL, and socat as low-level runtime tools.
