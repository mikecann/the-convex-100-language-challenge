  id: convex-rs-0.10.4-unversioned-sync
  sourceCommit: 6f1df8a8ba1665084ec001e307ca841ca17074d7
  endpoint: /api/sync
intendedCapabilities:
  - http
  - live
platforms:
  - linux/amd64
adapter:
  protocolVersion: 1
  entrypoint: /usr/local/bin/convex-adapter
  adapterOnlyCommands:
    - debugDisconnect
limitations:
  - Live authentication, optimistic updates, WebSocket mutations, WebSocket actions, journals, and TransitionChunk assembly are deferred.
  - HTTP response framing currently uses a bounded connection-close exchange; chunked and persistent response framing are deferred.
  - Live values cover Convex's JSON-safe subset; tagged Convex value conversions are deferred.
  - JSON input is limited to 2 MiB, 128 nesting levels, and 8192 structural nodes; active Live subscriptions are bounded to 64 entries and 8 MiB of conservatively charged state.
  - One manager-wide queue retains the newest 16 deliveries within a conservative 20 MiB exact-encoded and runtime-overhead budget.
  - Adapter output independently retains the newest 16 encoded events within 6 MiB, including an in-flight TCP write.
capabilities:
  - http
  - live
