schemaVersion: 1
id: factor
displayName: "Factor"
rank: 97
selectionTier: curated_backfill
implementation:
  status: attempting
  provenance: native
  version: 0.1.0
  notes: >-
    Native Factor implementation of Convex's documented JSON HTTP functions and
    the pinned sync profile. Strict JSON scanning, HTTP/1.1 framing, RFC 6455
    framing, and the sync-protocol state machine are written in Factor over
    io.sockets and io.sockets.secure; Factor's own TCP, TLS, threads, SHA-1,
    base64, and random vocabularies provide ordinary language facilities only.
toolchain:
  name: Factor
  version: "0.101"
syncProfile:
  id: convex-rs-0.10.4-unversioned-sync
  sourceCommit: 6f1df8a8ba1665084ec001e307ca841ca17074d7
  endpoint: /api/sync
intendedCapabilities:
  - http
  - live
platforms:
  - linux/amd64
adapter:
  protocolVersion: 1
  entrypoint: /usr/local/bin/convex-adapter
  adapterOnlyCommands:
    - debugDisconnect
limitations:
  - >-
    Docker build, language-local tests, and runtime images are unverified. No
    Docker command has been executed for this checkpoint, so compilation,
    deployment, and every runtime claim remain unproven.
  - >-
    Live authentication, optimistic updates, WebSocket mutations, WebSocket
    actions, journals, and TransitionChunk assembly are deferred. A chunk is
    treated as recoverable protocol drift.
  - >-
    Values cover Convex's JSON-safe subset. Tagged Convex Int64, bytes,
    special floats, and negative zero are outside scope, and exponent-form
    JSON numbers are rejected rather than guessed at.
  - >-
    HTTP responses are bounded to 2 MiB and framed by Content-Length, chunked
    transfer encoding, or connection close. JSON input is limited to 2 MiB,
    128 nesting levels, and 8192 entries per container.
  - >-
    Live delivery buffering is owned by this client. Each subscription keeps
    the newest 16 events within an 8 MiB conservatively charged budget, and
    active subscriptions are bounded to 64 entries.
  - >-
    Adapter output independently retains the newest 16 encoded events within
    6 MiB, reserving four slots and 64 KiB for control events, and abandons a
    write that misses its five-second absolute deadline.
capabilities:
  - http
  - live
