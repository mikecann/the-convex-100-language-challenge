limitations:
  - Live is pinned to an undocumented experimental sync profile, not a stable public Convex protocol.
  - HTTP bearer authentication is supported; Live authentication, optimistic updates, transition chunks, journals, and replay are deferred.
  - Each subscription keeps at most its newest 16 events and one MiB of pessimistically encoded value, error, data, and log output; old intermediate events are deliberately evicted for slow consumers. The adapter permits at most eight subscriptions so near-limit stopped queues remain below 128 MiB.
