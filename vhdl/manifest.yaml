limitations:
  - >-
    Live authentication, optimistic updates, WebSocket mutations, WebSocket
    actions, and TransitionChunk assembly are deferred.
  - >-
    The WebSocket handshake does not verify the server's
    Sec-WebSocket-Accept response header against SHA-1 of the client's key.
    A valid HTTP 101 upgrade response is still required, and every frame
    exchanged afterward is real RFC 6455 framing; only that one header's
    cryptographic check is skipped.
  - >-
    convex_sync.vhdl's own delivery queue holds at most SYNC_MAX_PENDING
    (8) already-decoded events between caller steps and drops the oldest
    undelivered event on overflow rather than growing without bound; it is
    a deliberately bounded queue, not a demand-driven stream, and its
    overflow behaviour is exercised by client-local tests.
  - >-
    JSON numbers are accepted only when mathematically integral and
    representable exactly within a safe range; fractional, quoted,
    non-finite, and out-of-range values are rejected at the point of use.
  - >-
    The client is single threaded by construction: convex_transport's one
    process owns the foreign boundary end to end, so Live progress and any
    concurrent HTTP call are interleaved by that process's own request
    queue rather than by OS-level concurrency.
  - >-
    GHDL's LLVM backend links a genuine standalone native ELF with no
    GHDL simulation runtime shared library; the design elaborates once at
    process start and then runs as ordinary compiled code, not as a
    long-lived simulator kernel.
capabilities:
  - http
  - live
