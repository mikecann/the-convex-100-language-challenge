schemaVersion: 1
id: vhdl
displayName: "VHDL"
rank: 41
selectionTier: ranked
implementation:
  status: attempting
  provenance: native
  version: 0.1.0
  notes: >-
    A Convex client expressed as a simulated circuit -- processes, signals
    and a clock -- rather than VHDL used procedurally with `wait`
    statements sprinkled through it. client/native.c supplies exactly the
    foreign primitives standard VHDL has none of (sockets, TLS, a
    monotonic clock, entropy, environment access, process exit status) as
    two VHPIDIRECT-callable C functions; every byte of HTTP, WebSocket and
    JSON protocol text, and every deadline and retry, stays in VHDL.
    convex_native.vhdl's clocked request/acknowledge bus connects the two:
    convex_transport's process is the sole owner of the foreign boundary,
    and every caller drives it through the xport_call procedure chain.
    convex_buffer.vhdl (fixed-capacity byte buffers, decimal/base64/hex),
    convex_json.vhdl (a bounded token-array JSON codec), convex_http.vhdl
    (a hand-written HTTP/1.1 client), convex_ws.vhdl (RFC 6455 WebSocket
    framing), convex_sync.vhdl (the pinned /api/sync Live protocol) and
    convex.vhdl (the public call facade) are built on that bus. Real
    OpenSSL certificate- and hostname-verified TLS runs through native.c's
    boundary. GHDL requires an unresolved signal's complete set of drivers
    to come from one process (or one procedure-call chain rooted in one
    process); two different processes may each drive a different field of
    the same record signal, but not the same unresolved scalar, and GHDL
    only rejects the latter at simulation-elaboration, not at `ghdl -a`/
    `-e`. client/convex_native.vhdl's split of the bus into `xport_req`
    (driven only by the caller-side chain) and `xport_ack` (driven only by
    convex_transport's process) is the minimal shape that satisfies this,
    proven both positively and with a negative-control entity.
