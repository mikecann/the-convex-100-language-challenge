limitations:
  - Capability badges remain empty until root runs the serial shared conformance evidence.
  - Live authentication, optimistic updates, chunks, journals, and replay are deferred.
  - All subscriptions share one newest-16, 4 MiB encoded delivery budget; one slow subscription cannot multiply the allowance.
  - Adapter output, including an in-flight write, shares a separate newest-16, 4 MiB encoded budget and drops only stale subscription snapshots under pressure.
  - Adapter command lines are limited to 1 MiB encoded, Live messages to 2 MiB encoded, and the Live owner queue to 64 events.
  - The runtime retains Clojure compiler classes because the Clojure runtime loads them while booting AOT-compiled namespaces; it exposes no compiler command, source tree, or package manager.
capabilities:
  - http
  - live
