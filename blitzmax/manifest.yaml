implementation:
  status: attempting
  provenance: native
  version: 0.1.0
  notes: >-
    Native BlitzMax NG implementation. The Convex HTTP envelopes, the RFC 6455
    WebSocket handshake and frame codec, the pinned /api/sync query-set
    protocol, bounded JSON handling, and every deadline are written in
    BlitzMax. Byte transport uses the stock Net.mbedtls module for TCP and TLS
    and the stock Text.Json module for parsing and serialising values.
