implementation:
  status: attempting
  provenance: native
  version: 0.1.0
  notes: >-
    Native Io client. The HTTP envelope, RFC 6455 framing, SHA-1, base64
    handling, JSON scanning, the pinned sync state machine, reconnect and
    rehydration are all written in Io. A single purpose-built C file supplies
    the byte-level transport Io's VM does not have at all: sockets, OpenSSL
    client TLS, readiness polling, CSPRNG bytes and a monotonic clock.
