id: delphi-object-pascal
displayName: "Delphi/Object Pascal"
rank: 25
selectionTier: ranked
implementation:
  status: attempting
  provenance: native
  version: 0.1.0
  notes: >-
    Native Object Pascal client written in Free Pascal's `-Mdelphi` mode.
    Query, Mutation, and Action always go over HTTP through the bundled
    fphttpclient unit; Subscribe opens (or reuses) one WebSocket connection,
    hand-framed over fpc's own ssockets/sslsockets/opensslsockets units,
    carrying only query-set add/remove and reactive updates. TLS transport,
    certificate and hostname verification, and OpenSSL-backed entropy are
    all ordinary fpc library calls, not hand-rolled OpenSSL bindings, with
    one documented exception: fpc's TOpenSSLSocketHandler never calls
    SSL_CTX_set_default_verify_paths, so this client resolves the distro CA
    bundle itself before every TLS connect (see ConvexSocket.DefaultCaBundlePath)
    or verification would silently pass with nothing to check against.
toolchain:
  name: Free Pascal
  version: "3.2.2"
