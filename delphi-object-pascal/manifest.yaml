limitations:
  - No Docker build has been run against this source yet, so every claim
    below the source level is unverified, including the apt package pins,
    the fpc `-Mdelphi -O2` build flags, the readelf amd64 assertions, and
    the runtime-image pruning list.
  - Free Pascal has no API to report its own version at run time, so the
    adapter's `hello` response reports a hardcoded runtime string
    ("Free Pascal 3.2.2 (Delphi mode)") matching the pinned toolchain
    instead of an introspected value.
  - The Live subscription's pending-event list (ConvexSync.PendingEvents) is
    an ordinary unbounded TObjectList, not a bounded queue with a documented
    overflow policy. This has not yet been proven safe under the shared
    conformance byte-budget check with a stopped reader and near-maximum
    messages, and may need a bound before Live evidence can pass.
  - Live authentication (SetAuth against an open subscription is wired
    client-side but not proven against a real deployment), WebSocket
    mutations and actions, and optimistic updates are not implemented and
    fail closed.
  - The deterministic Live unit tests exercise reconnect and rehydration
    suppression logic locally; only the shared verifier can earn the
    required evidence for five real TCP/WSS reconnects.
capabilities: []
