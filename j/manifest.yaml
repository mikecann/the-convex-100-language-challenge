implementation:
  status: working
  provenance: native
  version: 0.1.0
  notes: >-
    Native J implementation of the documented JSON HTTP functions and the
    pinned Live sync profile. There is no compiled C helper: J's own 15!:0
    ("cd", call dll) foreign conjunction binds directly to libc for raw TCP
    sockets, to libssl.so.3 for the TLS 1.3 handshake, and to libcrypto.so.3
    for SHA-1 and randomness, the same in-process foreign-function approach
    proven end to end against this project's own hosted deployment before
    any client source was written. RFC 6455 frame masking, the JSON reader
    and writer, the HTTP envelope, and the single-owner Live state machine
    with its reconnect and replay are all J, expressed as whole-array
    transforms (bit-plane XOR for masking, mixed-radix packing for frame
    lengths) rather than per-byte scalar loops where the shape of the
    protocol data made that natural.
toolchain:
