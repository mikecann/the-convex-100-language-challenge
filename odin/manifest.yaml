adapter:
  protocolVersion: 1
  entrypoint: /usr/local/bin/convex-adapter
  adapterOnlyCommands:
    - debugDisconnect
limitations:
  - The Docker test stage (build, the curl connect-only patch's own regression
    test, unit tests, the example run, and the process-driven adapter
    conformance script) passes on a remote builder for this source
    checkpoint. Shared and hosted conformance later passed, earning HTTP and
    Live.
  - Live authentication, WebSocket mutations/actions, optimistic updates, and mutation replay are deferred.
  - TransitionChunk assembly is deferred and treated as protocol drift that reconnects.
  - Public values are bounded strict JSON text so callers choose their own Odin application type.
  - Each subscription retains only its newest update; the adapter caps active subscriptions at 16 and its output queue at 16 records or 8 MiB.
capabilities:
