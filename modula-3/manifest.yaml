implementation:
  status: attempting
  provenance: native
  notes: >-
    Native CM3 (Critical Mass Modula-3) implementation. Plain TCP comes
    from Modula-3's own long-stable standard-library socket interfaces
    (the "tcp" package: TCP.i3/IP.i3, DEC SRC heritage). TLS is a narrow
    OpenSSL EXTERNAL-procedure C shim (client/shim.c), layered over the
    same file descriptor the standard TCP connection already opened,
    verifying both the certificate chain and the hostname -- no
    FFI-generation tooling, no vendored code-dump step, just a stable
    procedure boundary. Replaces oz (rank 52), ruled infeasible on a
    reproducible memory-safety bug in Mozart 2's own unmaintained
    2016-era AST-dump code generator while extending the VM for TLS; see
    INFEASIBLE.md.
