selectionTier: coverage
implementation:
  status: attempting
  provenance: native
  version: 0.1.0
  notes: >-
    Native Ring client built on the official Ring toolchain. RingLibCurl
    supplies TLS, HTTP and RFC 6455 transport and RingLibuv supplies the
    monotonic clock and the conformance adapter's controller stream. Convex
    request envelopes, the response classifier, the exact-subtree JSON scanner,
    the query-set state machine, reconnect ownership and publication decisions
    are all implemented in Ring. Built from ring-lang/ring tag v1.27, commit
    f88d95236319460327b05efcfdab7c342caa7d22.
toolchain:
  name: Ring
  version: "1.27"
