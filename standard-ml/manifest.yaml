schemaVersion: 1
id: standard-ml
displayName: "Standard ML"
rank: 54
selectionTier: ranked
implementation:
  status: working
  provenance: native
  version: 0.1.0
  notes: >-
    Native Poly/ML implementation of Convex's documented JSON HTTP functions and
    the pinned sync profile. JSON, SHA-1, base64, HTTP/1.1, and RFC 6455 framing
    are written in Standard ML over the Basis Library's sockets and threads. TLS
    is the one borrowed facility: OpenSSL is driven through memory BIOs by the
    Standard ML transport, so no foreign call performs I/O or blocks.
toolchain:
  name: Poly/ML
  version: 5.7.1-5
syncProfile:
  id: convex-rs-0.10.4-unversioned-sync
  sourceCommit: 6f1df8a8ba1665084ec001e307ca841ca17074d7
  endpoint: /api/sync
intendedCapabilities:
  - http
  - live
platforms:
  - linux/amd64
adapter:
  protocolVersion: 1
  entrypoint: /usr/local/bin/convex-adapter
  adapterOnlyCommands:
    - debugDisconnect
limitations:
  - Docker build, language-local gates, final image policy, and shared local
    and hosted black-box conformance passed, earning HTTP and Live.
  - Poly/ML ships no formatter, so the test image runs a Standard ML style and
    lint gate over every checked-in source in this directory instead of
    claiming a format step that does not exist.
  - Building linux/amd64 under emulation on an arm64 host occasionally faults
    inside the C toolchain. polyc retries only that exact signature; a fault in
    the busybox prune step needs the image build repeating.
  - Live authentication, optimistic updates, WebSocket mutations, WebSocket
    actions, journals, and TransitionChunk assembly are deferred.
  - HTTP uses a bounded single-request connection-close exchange; any transfer
    coding, a repeated or conflicting framing header, and a Content-Length that
    is not a plain decimal are all rejected rather than resolved in the
    server's favour.
  - Only IPv4 deployment addresses resolve; bracketed IPv6 URLs are rejected
    rather than half-supported. A literal address is converted without a
    lookup, and a name is resolved on its own thread and then cached, so no
    caller waits on the resolver beyond its own deadline.
  - A Live subscribe retries its first connection inside one absolute caller
    budget. A caller that stops waiting has its acknowledgement cancelled and
    the query withdrawn with a real Remove.
  - Live values cover Convex's JSON-safe subset; tagged Convex value conversions
    are deferred.
  - JSON input is limited to 2 MiB, 128 nesting levels, and 8192 structural
    nodes; active Live subscriptions are bounded to 64 entries and 8 MiB of
    conservatively charged state.
  - One manager-wide queue retains the newest 16 deliveries within a
    conservative 20 MiB exact-encoded and runtime-overhead budget.
  - Adapter output independently retains the newest 16 encoded events within
    6 MiB, including an in-flight write. On the TCP transport the whole
    connection shares one cumulative 30-second write budget, spent by failed
    writes as well as successful ones.
  - The bounded-writer audit is a separate test-only executable. Nothing
    selects it at run time and the build asserts it is absent from the shipped
    adapter.
capabilities:
  - http
  - live
