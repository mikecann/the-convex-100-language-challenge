schemaVersion: 1
id: idris
displayName: "Idris"
rank: 93
selectionTier: curated_backfill
implementation:
  status: attempting
  provenance: native
  version: 0.1.0
  notes: >-
    Native Idris 2 client on the RefC backend. Convex HTTP envelopes, JSON,
    RFC 6455 framing, and the pinned sync profile are implemented in Idris; a
    small C shim under client/support provides only sockets, poll, monotonic
    time, randomness, and OpenSSL byte transport.
toolchain:
  name: Idris 2
  version: 0.7.0
syncProfile:
  id: convex-rs-0.10.4-unversioned-sync
  sourceCommit: 6f1df8a8ba1665084ec001e307ca841ca17074d7
  endpoint: /api/sync
intendedCapabilities:
  - http
  - live
platforms:
  - linux/amd64
adapter:
  protocolVersion: 1
  entrypoint: /usr/local/bin/convex-adapter
  adapterOnlyCommands:
    - debugDisconnect
limitations:
  - The Docker test stage (build, unit suites and the example run) passes on a
    remote builder for this source checkpoint. Shared and hosted conformance
    have not been run, so no capability is claimed and badges remain unearned.
  - The client is single-threaded and caller-driven; nextUpdate runs the sync owner loop rather than a background thread.
  - Each client retains at most 64 reactive updates and 4 MiB of encoded state across all subscriptions, dropping the globally oldest intermediate state for a slow consumer.
  - The adapter queues at most 128 events, 2 MiB per event and 8 MiB in total, and fails on an absolute output deadline when the controller stops reading.
  - Live authentication, optimistic updates, WebSocket mutations and actions, and TransitionChunk assembly are deferred; a TransitionChunk is treated as profile drift.
  - Values are limited to the documented JSON format; Int64, bytes, and special floats are not claimed.
  - Capability badges are intentionally empty until shared local and hosted conformance pass.
capabilities:
  - http
  - live
