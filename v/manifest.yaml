implementation:
  status: attempting
  provenance: native
  version: 0.1.0
  notes: >
    Native V client. Convex's documented JSON HTTP API and the pinned sync
    profile are implemented in V in this directory, including HTTP/1.1 request
    and response framing over net and net.ssl, envelope decoding, the Live
    state machine, query-set versioning, reconnect replay, and bounded
    delivery. V's standard library supplies ordinary sockets, TLS, JSON, SHA-1,
    and base64; the bounded RFC 6455 transport is implemented here.
    TcpConn's own read/write timeouts never bound OpenSSL's direct
    SSL_read/SSL_write calls, so this client also sets SO_RCVTIMEO and
    SO_SNDTIMEO on the raw file descriptor itself (see client/socket_deadline.c.v).
    Both capability badges are earned: the shared coordinator ran local and
    hosted conformance against a clean exact-head build and both passed 31
    of 31.
