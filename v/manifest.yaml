limitations:
  - V's net.websocket is intentionally not used; this source owns bounded upgrade and frame parsing so peer-declared lengths are checked before allocation and read/write deadlines are cumulative.
  - Live authentication, WebSocket mutations and actions, optimistic updates, journals, and TransitionChunk assembly are deferred.
  - HTTP uses one bounded connection-close exchange per call; persistent connections and request compression are deferred.
  - Live values cover Convex's JSON-safe subset; tagged Convex value conversions are deferred.
  - JSON input is limited to 2 MiB, 128 nesting levels, and 8192 structural nodes. Active Live subscriptions are bounded to 64.
  - Each subscription retains at most 16 deliveries within 4 MiB, and the whole client retains at most 16 deliveries within 8 MiB, charged on twice the encoded size plus 128 bytes per decoded JSON node and a fixed delivery overhead.
  - The adapter's terminal writer independently retains at most 16 encoded events within 6 MiB, including an in-flight write.
  - Raw WebSocket fixtures exercise real loopback network paths for fragmented UTF-8, controls, invalid kinds, a pre-allocation 1 GiB declaration, continuous dribble, and a stopped reader.
capabilities:
  - http
  - live
