id: simula
displayName: "Simula 67"
rank: 79
selectionTier: coverage
implementation:
  status: attempting
  provenance: native
  version: 0.1.0
  notes: >-
    Native Simula 67 implementation of Convex's documented JSON HTTP functions
    and the pinned /api/sync protocol, translated to C by GNU Cim. JSON,
    HTTP/1.1 framing, RFC 6455 WebSocket framing, base64, hex, and every
    Convex sync semantic are written in Simula. One reviewed C support file,
    client/convexrt.c, supplies only the primitives the 1967 report does not
    have: TCP sockets, TLS, non-blocking read and write, readiness polling,
    listen and accept, a monotonic clock, entropy, and environment variable
    access, called from Simula through Cim's `external C procedure`. It
    contains no HTTP, no WebSocket framing, no JSON and no Convex knowledge;
    every deadline, retry, and bound is written in Simula.
