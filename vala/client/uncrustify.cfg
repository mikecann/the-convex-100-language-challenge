# Vala has no compiler-bundled formatter. Keep the checked-in educational
# source on a small, pinned Uncrustify profile that preserves its two-space
# indentation and avoids reflowing the canonical example comments.
newlines = auto
input_tab_size = 2
output_tab_size = 2
indent_columns = 2
indent_with_tabs = 0
indent_namespace = true
indent_class = true
nl_class_leave_one_liners = true
nl_func_leave_one_liners = true
